<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes recettes de pâtisseries</title>
    <link rel="stylesheet" href="pas_toucher/style0.css">
    <style>
        /* Le livre s'adapte à la largeur de l'écran ;
           la zone cliquable "Entrée" est placée en pourcentages
           pour rester au bon endroit quelle que soit la taille. */
        .livre {
            position: relative;
            width: 100%;
            max-width: 1417px;
            margin: 0 auto;
        }
        .livre img {
            display: block;
            width: 100%;
            height: auto;
        }
        .livre .entree {
            position: absolute;
            left: 39.5%;
            top: 8.6%;
            width: 14.8%;
            height: 10.5%;
            border-radius: 8px;
        }
        .livre .entree:hover,
        .livre .entree:focus {
            box-shadow: 0 0 18px 4px rgba(255, 215, 120, 0.9);
            outline: none;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4a3c">
    <link rel="icon" href="icones/favicon.ico">
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <script src="installer.js" defer></script>
</head>
<body>
    <div class="livre">
        <img src="pas_toucher/photo_entree/livre.webp"
             alt="Livre ouvert : Mes recettes de pâtisseries, invitation à feuilleter">
        <a class="entree" href="pas_toucher/accueil.html" aria-label="Entrer dans le livre de recettes"></a>
    </div>
</body>
</html>
